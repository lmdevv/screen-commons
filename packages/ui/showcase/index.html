<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Commons — design system</title>
    <link rel="icon" type="image/svg+xml" href="../src/assets/logo.svg?no-inline" />
    <script>
      /* Showcase: allow ?theme=dark|light to force a theme (used by the screenshot script). */
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get("theme");
          if (forced === "dark" || forced === "light")
            localStorage.setItem("screen-commons-theme", forced);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var k = "screen-commons-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") t = "system";
          var d =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(d ? "dark" : "light");
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
